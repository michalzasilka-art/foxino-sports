<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a5fd6">
<title>Foxino Snow Sports · Fugio</title>
<meta name="description" content="Foxino Snow Sports: slalom, halfpipe, ski jump, sled run and snowball biathlon. Read the sentence and tap the bubble with the right English word.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="snow.css?v=2">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="fxText"></div>
<div id="flash"></div>
<div id="bars"><i></i><i></i></div>

<!-- the race HUD: the clock / points and the progress, the friend chip -->
<div id="hud" class="hidden">
  <div id="hudMain"><span id="hudBig">0.0</span><span id="hudSmall"></span></div>
  <div id="friendChip" class="hidden"><i></i><span id="friendName">FRIEND</span><b id="friendVal">–</b></div>
  <div id="prog"><i id="progMe"></i><i id="progFr" class="hidden"></i></div>
</div>
<!-- the question card -->
<div id="card" class="hidden">
  <div id="cardTop"><span id="cardWho">TAP THE RIGHT WORD</span><span id="cardNum"></span></div>
  <div id="sentence"></div>
  <div id="note"></div>
</div>
<div id="banner"></div>
<div id="combo" hidden></div>

<button id="leaveBtn" class="topbtn" type="button" aria-label="Leave"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>LEAVE</span></button>
<button id="muteBtn" class="topbtn" type="button" aria-label="Sound on or off"><svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.6 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>

<!-- the start screen (when the page is opened on its own; from the Foxino Sports lobby the race starts at once) -->
<section id="start" class="screen hidden">
  <div class="title-wrap"><p class="kicker">FOXINO SNOW SPORTS</p><h1 class="title" id="startTitle">SLALOM</h1><p class="subtitle" id="startSub"></p></div>
  <div class="start-panel">
    <div class="best-line" id="bestLine"></div>
    <button id="playBtn" class="bigbtn" type="button">PLAY</button>
    <button id="packBtn" class="packcard" type="button"></button>
  </div>
</section>

<section id="end" class="screen hidden">
  <div class="panel">
    <p class="kicker" id="endKick">SLALOM</p>
    <div class="medal" id="endMedal"></div>
    <h2 id="endTitle">Great run!</h2>
    <div class="endscore"><b id="endScore">0</b><span id="endUnit"></span></div>
    <p class="endline" id="endLine"></p>
    <div id="missed" class="missed hidden"><small>Learn these sentences</small><ol id="missedList"></ol></div>
    <div class="endbtns"><button id="againBtn" class="bigbtn" type="button">PLAY AGAIN</button><button id="menuBtn" class="linkbtn" type="button">Menu</button></div>
  </div>
</section>

<div id="loading"><div><b id="loadTitle">SNOW SPORTS</b><div class="bar"><i id="loadBar"></i></div><span id="loadTxt">Grooming the snow…</span></div></div>
<noscript>This game needs JavaScript.</noscript>
<script src="../packages.js?v=1"></script>
<script src="/shared/pack-picker.js?v=8"></script>
<script src="../qbank.js?v=1"></script>
<script type="module" src="engine.js?v=10"></script>
</body>
</html>
