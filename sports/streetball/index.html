<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3d3f8f">
<title>Streetball · Foxino Sports · Fugio</title>
<meta name="description" content="Streetball: Foxino plays 1-on-1 basketball against Rob the robot. Tap the bubble with the right English word to beat Rob, score, steal and block. First to 3 baskets.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="streetball.css?v=1">
</head>
<body>
<canvas id="gl"></canvas>
<div id="tags"></div>
<div id="labels"></div>
<canvas id="confetti"></canvas>

<div id="hud" class="hidden">
  <div id="card">
    <div id="cardTop"><span id="cardWho">YOUR SHOT</span><span id="score" class="score"></span></div>
    <div id="sentence"></div>
    <div class="tbar"><i id="tFill"></i></div>
    <div id="note"></div>
  </div>
</div>
<div id="banner"></div>
<div id="combo" hidden></div>
<div id="fxText"></div>
<div id="flash2"></div>

<button id="leaveBtn" class="topbtn" type="button" aria-label="Leave the game"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>LEAVE</span></button>
<button id="muteBtn" class="topbtn" type="button" aria-label="Sound on or off"><svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.6 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>

<section id="start" class="screen hidden">
  <div class="title-wrap"><h1 class="title"><span class="t1">1 ON 1</span><span class="t2">STREETBALL</span></h1>
    <p class="subtitle">Tap the bubble with the right word to beat Rob, score, steal and block. First to 3 baskets!</p></div>
  <div class="start-panel">
    <div id="bestLine" class="best-line"></div>
    <button id="packBtn" class="packcard" type="button"></button>
    <button id="playBtn" class="bigbtn" type="button">PLAY vs ROB</button>
  </div>
</section>



<section id="end" class="screen hidden">
  <div class="panel">
    <h2 id="endTitle">You won!</h2>
    <div class="stars" id="stars"><i></i><i></i><i></i></div>
    <div class="endscore"><b id="endGames">2 – 1</b><span>games</span></div>
    <p class="endline" id="endLine"></p>
    <div id="missed" class="missed hidden"><small>Learn these sentences</small><ol id="missedList"></ol></div>
    <button id="againBtn" class="bigbtn" type="button">PLAY AGAIN</button>
    <button id="menuBtn" class="linkbtn" type="button">Menu</button>
  </div>
</section>

<div id="loading"><div class="load-box"><div class="load-title">STREETBALL</div><div class="load-bar"><i id="loadFill"></i></div><div class="load-text" id="loadText">Painting the court…</div></div></div>
<script src="../packages.js?v=1"></script>
<script src="/shared/pack-picker.js?v=8"></script>
<script src="../qbank.js?v=1"></script>
<script type="module" src="streetball.js?v=12"></script>
</body>
</html>
